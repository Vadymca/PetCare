services:
  db:
    image: postgis/postgis:16-3.4
    container_name: petcare_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  petcare.api:
    build:
      context: .
      dockerfile: PetCare.Api/Dockerfile
    container_name: petcare_api
    depends_on:
      - db
      - minio
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    entrypoint: ["/wait-for-db.sh", "db", "5432", "dotnet", "PetCare.Api.dll"]
    env_file:
      - .env
    ports:
      - '5100:80'
    volumes:
      - "${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro"
      - "${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro"
    restart: unless-stopped

     # 🟣 MinIO (S3-сумісне сховище)
  minio:
    image: quay.io/minio/minio:latest
    container_name: petcare_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Веб-консоль
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  petcare.api.sdk:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: petcare_api_sdk
    working_dir: /app
    volumes:
      - .:/app                     # Монтуємо всю папку PetCare
      - dotnet_tools_cache:/root/.dotnet/tools
    depends_on:
      - db
    entrypoint: ["tail", "-f", "/dev/null"]  # залишаємо контейнер активним для dotnet ef
    restart: unless-stopped

volumes:
  pgdata:
  dotnet_tools_cache:
  minio_data:
