server {
    listen 80;
    server_name api-dobrodiy.kn314-uz.keenetic.pro;

    # Redirect HTTP → HTTPS
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-dobrodiy.kn314-uz.keenetic.pro;

    ssl_certificate /etc/letsencrypt/live/api-dobrodiy.kn314-uz.keenetic.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dobrodiy.kn314-uz.keenetic.pro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://petcare.api:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
