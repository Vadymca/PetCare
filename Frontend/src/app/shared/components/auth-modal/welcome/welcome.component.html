<div class="text-center">
  <div class="flex justify-center text-primary-orange content-center">
    <app-icon [name]="'logoUkrSmall'" class="relative -top-5"></app-icon>
  </div>
  <h5 class="text-40 mb-1 relative -top-2">
    {{ 'WELCOME_TITLE' | translate | uppercase }}
  </h5>

  <p class="mb-6">{{ 'DONT_HAVE_ACCOUNT' | translate }}</p>
  <h5 class="text-40 relative -top-2">
    {{ 'REGISTER' | translate | uppercase }}
  </h5>
  <div class="space-y-4 mt-10 content-center">
    <div class="flex justify-center">
      <app-primary-large-button
        buttonTitle="REGISTER"
        (pressButton)="emitOption('register-email')"
      ></app-primary-large-button>
    </div>
    <div class="flex justify-center">
      <app-secondary-large-button
        buttonTitle="LOGIN"
        (pressButton)="emitOption('login')"
      ></app-secondary-large-button>
    </div>
  </div>
  <p class="mt-5 mb-11">{{ 'OR_CONTINUE_WITH' | translate | uppercase }}</p>
  <div class="flex space-x-4 justify-center">
    <app-icon [name]="'google'" class="cursor-pointer"></app-icon>
    <app-icon [name]="'apple'" class="cursor-pointer"></app-icon>
    <app-icon [name]="'facebook'" class="cursor-pointer"></app-icon>
  </div>
  <div class="flex justify-center">
    <button
      type="button"
      class="flex mt-[60px] space-x-4 justify-center cursor-pointer hover:text-primary-orange focus:outline-none focus:ring-2 focus:ring-primary-orange focus:ring-offset-2 bg-transparent border-none"
      (click)="emitOption('login')"
      (keyup.enter)="emitOption('login')"
      (keyup.space)="emitOption('login')"
      tabindex="0"
    >
      <app-icon [name]="'userLarge'"></app-icon>
      <p class="self-end">{{ 'ADMIN_LOGIN' | translate | uppercase }}</p>
    </button>
  </div>
</div>
