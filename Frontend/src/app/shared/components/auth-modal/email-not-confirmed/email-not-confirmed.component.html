<div class="text-center h-full flex flex-col items-center pb-4">
  <h5 class="text-40 mt-5">
    {{ 'EMAIL_NOT_CONFIRMED_TITLE' | translate | uppercase }}
  </h5>

  <p class="mt-8 text-2xl">{{ 'EMAIL_NOT_CONFIRMED_MESSAGE' | translate }}</p>
  <div class="mt-8 flex-1 flex flex-col w-[360px]">
    <p
      class="text-sm text-secondary-neutral-doveGray ml-3 leading-snug text-left"
    >
      {{ 'EMAIL_NOT_CONFIRMED_DESCRIPTION' | translate }}
    </p>
    <div class="w-full flex flex-col justify-center items-center mt-4 mb-4">
      <div class="mt-8 text-sm text-secondary-neutral-doveGray ml-3">
        <a
          (click)="emitResendVerificationEmail()"
          (keyup.enter)="emitResendVerificationEmail()"
          (keyup.space)="emitResendVerificationEmail()"
          tabindex="0"
          role="button"
          class="hover:text-primary-orange underline cursor-pointer font-semibold font-inter"
        >
          {{ 'RESEND_VERIFICATION_EMAIL' | translate }}
        </a>
      </div>
    </div>
    <div class="flex-1 flex justify-center items-center w-ful h-full">
      <app-icon
        [name]="'logoFailure'"
        class="relative -top-5 text-secondary-neutral-mineShaft"
      ></app-icon>
    </div>
  </div>

  <!-- Submit -->
  <div class="content-center">
    <app-primary-large-button
      class="w-[260px]"
      buttonTitle="LOGIN"
      (pressButton)="emitSubmitButton()"
    ></app-primary-large-button>
  </div>
</div>
