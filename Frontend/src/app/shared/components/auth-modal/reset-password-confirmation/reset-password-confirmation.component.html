<div class="text-center h-full flex flex-col items-center pb-4">
  <h5 class="text-40 mt-5">
    {{ 'RESET_PASSWORD_CONFIRMATION_TITLE' | translate | uppercase }}
  </h5>

  <p class="mt-8 text-2xl">
    {{ 'RESET_PASSWORD_CONFIRMATION_MESSAGE' | translate }}
  </p>

  <p
    class="mt-8 text-sm text-secondary-neutral-doveGray ml-3 leading-snug text-center w-[360px]"
  >
    {{ 'RESET_PASSWORD_CONFIRMATION_DESCRIPTION' | translate }}
  </p>

  <div class="flex-1 flex justify-center items-center w-ful h-full">
    <app-icon [name]="'logoSuccess'" class="relative -top-5"></app-icon>
  </div>
  <!-- Submit -->
  <div class="content-center">
    <div class="flex justify-center">
      <app-primary-large-button
			class="w-[260px]"
        buttonTitle="LOGIN"
        (pressButton)="emitSubmitButton()"
      ></app-primary-large-button>
    </div>
  </div>
</div>
