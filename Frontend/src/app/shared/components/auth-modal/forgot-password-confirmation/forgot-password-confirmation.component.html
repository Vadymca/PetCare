<div class="text-center h-full flex flex-col items-center pb-4">
  <h5 class="text-40 mt-5" style="font-size: clamp(16px, 6.5vw, 40px)">
    {{ 'CONFIRMATION_TITLE' | translate | uppercase }}
  </h5>

  <p class="mt-8 text-2xl">{{ 'CONFIRMATION_MESSAGE' | translate }}</p>
  <div class="w-[389px]">
    <p
      class="mt-8 text-sm text-secondary-neutral-doveGray ml-3 leading-snug text-left"
    >
      {{ 'CONFIRMATION_FORGET_PASSWORD_DESCRIPTION' | translate }}
    </p>
  </div>

  <div class="flex-1 flex justify-center items-center w-ful h-full">
    <app-icon [name]="'logoSuccess'" class="relative -top-5"></app-icon>
  </div>
  <!-- Submit -->
  <div class="content-center mt-2 sm:mt-4">
    <div class="flex justify-center">
      <app-primary-large-button
        class="w-[260px]"
        buttonTitle="LOGIN"
        (pressButton)="emitOption()"
      ></app-primary-large-button>
    </div>
  </div>
</div>
