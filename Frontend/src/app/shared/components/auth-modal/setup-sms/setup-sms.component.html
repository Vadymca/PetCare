<div class="flex flex-col items-center justify-center h-full">
  <h2 class="text-2xl font-bold mb-4 text-center">
    {{ 'ENTER_SMS_CODE' | translate }}
  </h2>

  <p class="text-center mb-6">
    {{ 'SMS_SENT_TO' | translate }} {{ hiddenPhoneNumber }}
  </p>

  <form
    [formGroup]="smsForm"
    (ngSubmit)="onSubmit()"
    class="flex flex-col items-center w-[360px]"
  >
    <input
      id="code"
      type="text"
      inputmode="numeric"
      formControlName="code"
      [placeholder]="'ENTER_CODE_FROM_SMS' | translate"
      class="mt-2 px-3 py-2 border rounded-[12px] h-12 focus:outline-none group-invalid:ring-2 group-invalid:ring-secondary-semantic-error pr-10 w-full"
      aria-label="SMS Code"
      [attr.aria-invalid]="smsForm.controls.code.invalid"
      autocomplete="one-time-code"
    />

    @if (errorMessage()) {
      <div class="text-secondary-semantic-error mt-2 text-sm" role="alert">
        {{ errorMessage() | translate }}
      </div>
    }

    <div class="mt-6 flex flex-col gap-4 w-full">
      <app-primary-large-orange-button
        [disabled]="isDisabled"
        [loading]="loading"
        buttonTitle="CONTINUE"
        (pressButton)="onSubmit()"
      ></app-primary-large-orange-button>

      <a
        (click)="onResend()"
        (keyup.enter)="onResend()"
        (keyup.space)="onResend()"
        tabindex="0"
        [attr.aria-disabled]="resendTimer() > 0"
        [class.opacity-50]="resendTimer() > 0"
        role="button"
        class="cursor-pointer font-bold underline hover:text-primary-orange text-center"
      >
        @if (resendTimer() > 0) {
          {{ 'RESEND_CODE_IN' | translate }} {{ resendTimer() }}s
        } @else {
          {{ 'RESEND_CODE' | translate }}
        }
      </a>
    </div>
  </form>
</div>
