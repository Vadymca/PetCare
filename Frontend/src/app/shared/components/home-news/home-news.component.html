<div
  class="w-full grid xl:grid-cols-4 gap-8 xl:grid-rows-5 justify-center mt-[40px] tracking-[-0.07em]"
>
  <div class="flex flex-row gap-5 xl:col-span-2 xl:row-span-2">
    <app-icon [name]="'orangeEllipseLeft'"></app-icon>
    <div class="flex flex-col gap-1">
      <p
        class="font-bold leading-none text-left tracking-[-0.07em]"
        style="font-size: clamp(16px, 12.5vw, 150px)"
      >
        {{ news[0].title | translate | lowercase }}
      </p>
      <p
        class="leading-[1.2] text-left mt-3 max-w-[321px]"
        style="font-size: clamp(14px, 5.5vw, 24px)"
      >
        {{ news[0].content | translate | uppercase }}
      </p>
    </div>
  </div>
  <div
    class="flex flex-row gap-5 xl:col-start-3 xl:row-start-2 xl:col-span-2 xl:row-span-2"
  >
    <app-icon [name]="'orangeEllipseRight'"></app-icon>
    <div class="flex flex-col gap-1">
      <p
        class="font-bold leading-none text-left tracking-[-0.07em]"
        style="font-size: clamp(16px, 12.5vw, 150px)"
      >
        {{ news[1].title | translate | lowercase }}
      </p>
      <p
        class="leading-[1.2] text-left mt-3 max-w-[321px]"
        style="font-size: clamp(14px, 5.5vw, 24px)"
      >
        {{ news[1].content | translate | uppercase }}
      </p>
    </div>
  </div>
  <div
    class="flex flex-row gap-5 xl:col-start-1 xl:col-span-3 xl:row-start-4 xl:row-span-2 h-full"
  >
    <app-icon [name]="'orangeEllipseBottom'"></app-icon>
    <div class="flex flex-col gap-1 xl:ml-[-170px] mt-4 ml-[-230px]">
      <p
        class="font-bold leading-none text-left tracking-[-0.07em]"
        style="font-size: clamp(16px, 12.5vw, 150px)"
      >
        {{ news[2].title | translate | lowercase }}
      </p>
      <p
        class="ml-[-100px] leading-[1.2] text-left mt-3 max-w-[400px]"
        style="font-size: clamp(14px, 5.5vw, 24px)"
      >
        {{ news[2].content | translate | uppercase }}
      </p>
    </div>
  </div>
  <div
    class="flex flex-col items-center xl:items-end xl:col-start-4 xl:row-start-5"
  >
    <app-secondary-large-button
      buttonTitle="SEE_ALL_NEWS"
      class="w-[260px] pb-[100px]"
      (click)="onSeeAllNewsClick()"
    ></app-secondary-large-button>
  </div>
</div>
