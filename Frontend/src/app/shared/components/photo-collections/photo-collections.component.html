<div class="flex flex-col gap-3">
  <div class="relative overflow-hidden h-[420px] w-full rounded-[20px]">
    @if (selectedItem()) {
      <img
        class="absolute inset-0 w-full h-full object-cover transition-opacity duration-700 ease-in-out"
        [src]="selectedItem()"
        alt="photo"
        [ngClass]="{
          'opacity-100': fadeIn() && isVisible(),
          'opacity-0': !fadeIn() || !isVisible(),
          invisible: !isVisible(),
        }"
        [attr.key]="selectedItem()"
        loading="eager"
      />
    }
  </div>

  <div class="flex gap-3">
    @if (items().length < 4 && items().length > 1) {
      <div class="flex gap-3 justify-between w-full">
        @for (item of items(); track item) {
          <div class="flex-1 min-w-[calc(33.3%-24px)] h-40">
            <div
              class="bg-primary-beige rounded-[20px] flex items-center overflow-hidden justify-center h-full w-full"
              [ngClass]="{
                'border-2 border-primary-orange': item === selectedItem(),
              }"
            >
              <img
                [src]="item"
                alt="photo"
                class="w-full h-full object-cover transition-transform duration-300 hover:scale-105"
                (click)="selectItem(item)"
                (keyup.enter)="selectItem(item)"
                (keyup.space)="selectItem(item)"
                tabindex="0"
                role="button"
                loading="eager"
              />
            </div>
          </div>
        }
      </div>
    } @else {
      <div class="flex items-center w-full mt-3">
        <!-- Ліва стрілка -->
        <button
          class="p-2 text-secondary-neutral-silverChalice hover:text-primary-orange"
          (click)="prev()"
        >
          <app-icon [name]="'leftArrow'"></app-icon>
        </button>

        <!-- Слайди -->
        <div
          class="flex gap-[24px] w-full justify-center items-center mx-[30px] overflow-hidden"
        >
          <div
            class="flex w-full justify-start items-center gap-6 transform"
            [ngClass]="
              animating() ? 'transition-transform duration-500 ease-in-out' : ''
            "
            [style.transform]="'translateX(' + offset() + '%)'"
            (transitionend)="onTransitionEnd()"
          >
            @if (items().length === 2) {
              <div
                class="overflow-hidden h-[420px] w-full bg-slate-500 rounded-[20px] shadow-md"
              >
                <img
                  [src]="items()[1]"
                  alt="photo"
                  class="w-full h-full object-cover"
                  loading="eager"
                />
              </div>
            } @else {
              @for (item of items(); track item) {
                <div
                  class="flex-1 min-w-[calc(33.3%-23px)] h-40"
                  (click)="selectItem(item)"
                  (keyup.enter)="selectItem(item)"
                  (keyup.space)="selectItem(item)"
                  tabindex="0"
                  role="button"
                >
                  <div
                    class="bg-primary-beige rounded-[20px] flex items-center overflow-hidden justify-center h-full w-full"
                    [ngClass]="{
                      'border-2 border-primary-orange': item === selectedItem(),
                    }"
                  >
                    <img
                      [src]="item"
                      alt="photo"
                      class="w-full h-full object-cover transition-transform duration-300 hover:scale-105"
                      loading="eager"
                    />
                  </div>
                </div>
              }
            }
          </div>
        </div>

        <!-- Права стрілка -->
        <button
          class="p-2 text-secondary-neutral-silverChalice hover:text-primary-orange"
          (click)="next()"
        >
          <app-icon [name]="'rightArrow'"></app-icon>
        </button>
      </div>
    }
  </div>
</div>
