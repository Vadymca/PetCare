<div
  class="flex flex-col text-center items-center bg-primary-light-orange w-full pt-[60px] text-secondary-neutral-mineShaft"
>
  <h3
    class="text-3xl font-bold text-secondary-neutral-mineShaft text-center text-[40px]"
    style="font-size: clamp(16px, 6.5vw, 40px)"
  >
    {{ 'YOU_CAN_HELP' | translate }}
  </h3>

  <div class="flex flex-col w-full mt-[40px] items-center">
    <div class="flex gap-2">
      {{ 'SHARE_WITH_FRIENDS' | translate | uppercase }}
      <app-icon [name]="'share'" class="text-primary-orange"></app-icon>
    </div>
    <div class="flex gap-3 items-center my-[40px]">
      <app-small-share-button
        [iconName]="shareInsta"
        (click)="onShareInstaClick()"
      ></app-small-share-button>
      <app-small-share-button
        [iconName]="shareFacebook"
        (click)="onShareFacebookClick()"
      ></app-small-share-button>
      <app-small-share-button
        [iconName]="shareX"
        (click)="onShareXClick()"
      ></app-small-share-button>
      <app-small-share-button
        [iconName]="shareTiktok"
        (click)="onShareTikTokClick()"
      ></app-small-share-button>
    </div>
  </div>
</div>
