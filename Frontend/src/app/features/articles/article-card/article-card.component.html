<div
  class="flex flex-col hover:bg-secondary-chileanFire-2 bg-primary-light-orange w-full h-full p-10 rounded-40 items-start justify-between text-secondary-neutral-mineShaft"
>
  <h3 class="font-inter font-bold text-base">
    {{ article?.title || '' | translate | uppercase }}
  </h3>
  <p class="mt-6 w-full">
    {{ article?.shortContent || '' | translate }}
  </p>
  @if (article?.image) {
    <div
      class="mt-[44px] rounded-[12px] overflow-hidden w-full max-h-[600px] aspect-square"
    >
      <!-- Фото -->
      <img
        [src]="article?.image"
        [alt]="article?.title"
        class="w-full object-cover center"
      />
    </div>
  }
</div>
